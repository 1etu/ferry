    <script type="module">
      const calm = matchMedia("(prefers-reduced-motion: reduce)");

      const demo = document.querySelector(".demo video");
      const toggle = document.querySelector(".demo-toggle");
      let wantsPlayback = !calm.matches;
      let isOnScreen = false;

      function syncDemo() {
        toggle.classList.toggle("is-paused", !wantsPlayback);
        toggle.setAttribute("aria-label", wantsPlayback ? "Pause video" : "Play video");
        if (!wantsPlayback || !isOnScreen) {
          demo.pause();
          return;
        }
        demo.preload = "auto";
        demo.play().catch((error) => {
          if (error.name !== "NotAllowedError") return;
          wantsPlayback = false;
          syncDemo();
        });
      }

      function flipPlayback() {
        wantsPlayback = !wantsPlayback;
        syncDemo();
      }

      new IntersectionObserver(([entry]) => {
        isOnScreen = entry.isIntersecting;
        syncDemo();
      }).observe(demo);
      toggle.addEventListener("click", flipPlayback);
      demo.addEventListener("click", flipPlayback);
      calm.addEventListener("change", () => {
        wantsPlayback = !calm.matches;
        syncDemo();
      });
    </script>
  </body>
