name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check, test and build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Check web types
        run: pnpm -C web check

      - name: Lint web
        run: pnpm -C web lint

      - name: Build web
        run: pnpm -C web build

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.12.0

      - name: Require gofumpt formatting
        run: test -z "$(gofumpt -l . | tee /dev/stderr)"

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Test Go with the race detector
        run: go run ./tools/test go --race

      - name: Test web
        run: go run ./tools/test web

      - name: Reject comments
        run: node tools/check-comments.mjs

      - name: Build Ferry.exe
        env:
          CGO_ENABLED: "0"
        run: go build -o bin/Ferry.exe ./cmd/ferry

      - name: Install Playwright browsers
        run: pnpm -C web exec playwright install chromium webkit

      - name: Run end-to-end tests
        run: go run ./tools/test e2e
