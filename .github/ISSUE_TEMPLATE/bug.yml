name: Bug report
description: Something in Ferry does not work as it should.
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what Ferry did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: ferry-version
    attributes:
      label: Ferry version
      description: Shown in the Ferry window under Settings › Updates.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Settings › System › About › Windows specifications.
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: ios-version
    attributes:
      label: iOS version
      description: Settings › General › About on the iPhone.
      placeholder: iOS 26.0
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The relevant lines of %LOCALAPPDATA%\Ferry\logs\ferry.log around the time it happened.
      render: text
